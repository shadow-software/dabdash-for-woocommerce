name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog filesystem tip scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version
      - name: Scan for secrets
        run: |
          set -euo pipefail
          cat > /tmp/th-exclude <<'EOF'
          (^|/)(node_modules|vendor|dist|build|\.git)(/|$)
          (^|/)package-lock\.json$
          (^|/)composer\.lock$
          (^|/)google-services\.json$
          (^|/)_wildcard\.localhost.*-key\.pem$
          (^|/)openpgp\.js$
          (^|/)(\.agents/vendor-src)(/|$)
          EOF
          trufflehog filesystem . \
            --fail \
            --no-update \
            --exclude-paths=/tmp/th-exclude \
            --results=verified,unknown

  repo-boot-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure repository boot markdown
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          total = 0
          for name in ("CLAUDE.md", "AGENTS.md"):
              path = Path(name)
              if path.is_symlink():
                  raise SystemExit(f"unsupported root-doc symlink: {path}")
              if not path.exists():
                  continue
              raw = path.read_bytes()
              text = raw.decode("utf-8", errors="replace")
              total += int(max(len(text.encode("utf-8")) / 4.0, len(text.split()) / 0.75))

          print(f"repo boot estimate: {total:,} tokens (budget 100,000)")
          if total > 100_000:
              raise SystemExit("repo boot markdown exceeds 100,000-token budget")
          PY

  script-tests:
    name: SDK version-bump script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/bump-plugin-version.test.sh

  quality:
    name: Lint · Analyse · Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
          fi
          composer install --prefer-dist --no-progress --no-interaction
      - run: composer lint
      - run: composer stan
      - run: composer test
      - name: php -l on every PHP file (excluding vendor)
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  # Official WordPress.org Plugin Check — same strict gate as AGT Sync / Crypto.
  # Built into the release layout first (composer --no-dev + distignore).
  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install runtime dependencies
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
          fi
          composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Build the release layout
        run: |
          set -euo pipefail
          slug=dabdash-for-woocommerce
          dest="${{ runner.temp }}/${slug}"
          mkdir -p "$dest"
          rsync -a --exclude-from=.distignore ./ "$dest/"
          bash .github/prune-vendor-dev.sh "$dest"
          test -f "$dest/vendor/autoload.php"
          echo "PLUGIN_DIR=$dest" >> "$GITHUB_ENV"

      # Pin to main until a release merges repo .wp-env.json (v1.1.9 still
      # overwrites it and boots PHP 8.3 — our plugin requires 8.5).
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@005058d6dbd2942b6a58610836b981c2ee3cc19d
        with:
          build-dir: ${{ env.PLUGIN_DIR }}
          slug: dabdash-for-woocommerce
          severity: 0
          include-experimental: true
          include-low-severity-errors: true
          include-low-severity-warnings: true
          # Fail the job on any finding so CI matches review expectations.
          strict: true
