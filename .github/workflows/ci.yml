name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-tests:
    name: SDK version-bump script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/bump-plugin-version.test.sh

  quality:
    name: Lint · Analyse · Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
          fi
          composer install --prefer-dist --no-progress --no-interaction
      - run: composer lint
      - run: composer stan
      - run: composer test
      - name: php -l on every PHP file (excluding vendor)
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  # Official WordPress.org Plugin Check — same strict gate as AGT Sync / Crypto.
  # Built into the release layout first (composer --no-dev + distignore).
  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install runtime dependencies
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
          fi
          composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Build the release layout
        run: |
          set -euo pipefail
          slug=dabdash-for-woocommerce
          dest="${{ runner.temp }}/${slug}"
          mkdir -p "$dest"
          rsync -a --exclude-from=.distignore ./ "$dest/"
          test -f "$dest/vendor/autoload.php"
          echo "PLUGIN_DIR=$dest" >> "$GITHUB_ENV"

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: ${{ env.PLUGIN_DIR }}
          slug: dabdash-for-woocommerce
          severity: 0
          include-experimental: true
          include-low-severity-errors: true
          include-low-severity-warnings: true
          # Fail the job on any finding so CI matches review expectations.
          strict: true
