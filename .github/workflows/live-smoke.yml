name: Live smoke

# Deploy release layout to cannabisdigest.net over SSH, run REST + wp eval-file
# smoke against Verde Ruta, roll back the plugin tree on any failure.
#
# Secrets (repo settings):
#   SMOKE_SSH_HOST              e.g. deploy@104.x.x.x
#   SMOKE_SSH_KEY               private key (full PEM)
#   SMOKE_WP_PATH               /var/www/cannabisdigest.net/public
#   SMOKE_SITE_URL              https://cannabisdigest.net
#   SMOKE_WP_USER               WP admin username for REST checks
#   SMOKE_WP_APP_PASSWORD       application password (spaces ok)
#   SDK_RELEASE_TOKEN           composer github oauth (private SDK)
#
# Local debugging: Brave MCP browser tools can inspect wp-admin; CI uses REST only.
on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: live-smoke-dabdash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    name: cannabisdigest.net smoke
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    env:
      SMOKE_PLUGIN_SLUG: dabdash-for-woocommerce
      SMOKE_WP_PATH: ${{ secrets.SMOKE_WP_PATH }}
      SMOKE_SSH_HOST: ${{ secrets.SMOKE_SSH_HOST }}
      SMOKE_SITE_URL: ${{ secrets.SMOKE_SITE_URL }}
      SMOKE_WP_USER: ${{ secrets.SMOKE_WP_USER }}
      SMOKE_WP_APP_PASSWORD: ${{ secrets.SMOKE_WP_APP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Guard — smoke secrets present
        env:
          SMOKE_SSH_KEY: ${{ secrets.SMOKE_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for v in SMOKE_SSH_HOST SMOKE_SSH_KEY SMOKE_WP_PATH SMOKE_SITE_URL; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing $v"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/smoke_key
          printf '%s\n' "${{ secrets.SMOKE_SSH_KEY }}" > ~/.ssh/smoke_key
          echo "SMOKE_SSH_KEY=$HOME/.ssh/smoke_key" >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install runtime dependencies
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            composer config --global github-oauth.github.com "$GH_TOKEN"
          fi
          composer install --no-dev --prefer-dist --no-progress --no-interaction

      - name: Build release ZIP
        id: build
        run: |
          set -euo pipefail
          slug=dabdash-for-woocommerce
          staging="$(bash .github/scripts/build-release-layout.sh)"
          zip="dist/${slug}.smoke.zip"
          mkdir -p dist
          ( cd "$(dirname "$staging")" && zip -r "$GITHUB_WORKSPACE/$zip" "$(basename "$staging")" )
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Deploy to cannabisdigest.net
        id: deploy
        env:
          SMOKE_ZIP_FILE: ${{ steps.build.outputs.zip }}
        run: bash .github/scripts/live-smoke-deploy.sh

      - name: REST smoke
        run: bash tests/live-smoke/rest-smoke.sh

      - name: Remote eval-file smoke
        run: bash tests/live-smoke/remote-smoke.sh tests/live-smoke/run-smoke.php

      - name: Roll back plugin on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: bash .github/scripts/live-smoke-rollback.sh
